name: Build Windows exe

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag to publish as a GitHub Release, for example v0.5.1
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Check Poetry
        run: python -m poetry --version

      - name: Install dependencies
        run: python -m poetry install --extras dev --no-root

      - name: Run tests
        run: python -m poetry run pytest -q

      - name: Stamp the version into the app
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        shell: bash
        env:
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: printf 'VERSION = "%s"\n' "$TAG" > src/version.py

      - name: Build executable
        run: python -m poetry run pyinstaller CrewChiefAssistant.spec --clean

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrewChiefAssistant-windows
          path: dist/CrewChiefAssistant.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          # A new tag is created on this commit, not on the default branch head
          target_commitish: ${{ github.sha }}
          files: dist/CrewChiefAssistant.exe
