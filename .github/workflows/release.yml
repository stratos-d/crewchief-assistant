name: Release on merge

# When a pull request is merged into main, build the exe and publish it as a GitHub Release
# tagged with the next version. PR labels pick the version bump:
#   release:major  v1.4.2 -> v2.0.0
#   release:minor  v1.4.2 -> v1.5.0
#   (no label)     v1.4.2 -> v1.4.3
#   skip-release   no release for this merge
on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

concurrency:
  # One release at a time, so two quick merges can't claim the same version.
  # If several merges queue up, GitHub keeps only the newest; its build includes the earlier changes.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'skip-release')
    runs-on: windows-latest

    steps:
      - name: Check out the merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0  # all tags, to find the latest version

      - name: Pick the next version
        id: version
        shell: bash
        env:
          MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}
          MINOR: ${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}
        run: |
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major=${major#v}
          if [ "$MAJOR" = "true" ]; then major=$((major + 1)); minor=0; patch=0
          elif [ "$MINOR" = "true" ]; then minor=$((minor + 1)); patch=0
          else patch=$((patch + 1)); fi
          echo "Latest release: ${latest:-none}. Releasing v$major.$minor.$patch"
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: python -m poetry install --extras dev --no-root

      - name: Build executable
        run: python -m poetry run pyinstaller CrewChiefAssistant.spec --clean

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          # The tag is created on the merge commit that was just built
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          generate_release_notes: true
          files: dist/CrewChiefAssistant.exe
